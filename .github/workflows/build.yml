name: Build e Publicar EXE
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Compilar
        shell: powershell
        run: pyinstaller --clean --noconfirm RAE_Turbo.spec
      - name: Gerar SHA-256
        shell: powershell
        run: (Get-FileHash "dist/RAE_Turbo.exe" -Algorithm SHA256).Hash | Out-File -Encoding ascii "dist/RAE_Turbo.exe.sha256"
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RAE_Turbo.exe
            dist/RAE_Turbo.exe.sha256
          name: "RAE Turbo - ${{ github.ref_name }}"
          generate_release_notes: true
